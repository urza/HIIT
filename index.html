<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Interval / HIIT workout timer with presets, sound cues and full offline support. All data stays on your device.">
  <title>HIIT Timer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HIIT Timer">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-phase="idle">
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-icon" src="icons/icon-192.png" alt="">
        <span>HIIT&nbsp;Timer</span>
      </div>
      <div class="topbar-actions">
        <button id="btn-install" class="icon-btn" hidden title="Install app" aria-label="Install app">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12m0 0l-4-4m4 4l4-4"></path>
            <path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"></path>
          </svg>
        </button>
        <button id="btn-sound" class="icon-btn" aria-pressed="true" title="Sound cues" aria-label="Toggle sound">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"></path>
            <path d="M15.5 8.5a5 5 0 010 7"></path>
            <path d="M18 6a8.5 8.5 0 010 12"></path>
          </svg>
        </button>
        <button id="btn-vibrate" class="icon-btn" aria-pressed="true" title="Vibration" aria-label="Toggle vibration">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="8" y="4" width="8" height="16" rx="2"></rect>
            <path d="M4 9a9 9 0 000 6"></path>
            <path d="M20 9a9 9 0 010 6"></path>
          </svg>
        </button>
        <button id="btn-fullscreen" class="icon-btn" title="Fullscreen" aria-label="Toggle fullscreen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 3H5a2 2 0 00-2 2v3"></path>
            <path d="M16 3h3a2 2 0 012 2v3"></path>
            <path d="M8 21H5a2 2 0 01-2-2v-3"></path>
            <path d="M16 21h3a2 2 0 002-2v-3"></path>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="card timer-card" aria-label="Timer">
        <div class="timer-top">
          <span id="badge" class="badge">Ready</span>
          <span id="round-info" class="round-info"></span>
        </div>

        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 260 260" aria-hidden="true">
            <circle class="ring-track" cx="130" cy="130" r="118"></circle>
            <circle id="ring-progress" class="ring-progress" cx="130" cy="130" r="118"></circle>
          </svg>
          <div class="ring-center">
            <div id="time" class="time">0:20</div>
            <div id="phase-label" class="phase-label" aria-live="polite">Ready</div>
          </div>
        </div>

        <div id="dots" class="dots"></div>

        <div class="controls">
          <button id="btn-primary" class="btn btn-primary">Start</button>
          <button id="btn-skip" class="btn btn-ghost" hidden>Skip</button>
          <button id="btn-reset" class="btn btn-ghost" hidden>Reset</button>
        </div>
      </section>

      <section class="card" id="settings-card" aria-label="Workout settings">
        <h2>Workout</h2>
        <div class="chips" id="chips">
          <button class="chip active" data-preset="classic" type="button">
            <span>Classic HIIT</span><small>4 × 20s / 60s</small>
          </button>
          <button class="chip" data-preset="tabata" type="button">
            <span>Tabata</span><small>8 × 20s / 10s</small>
          </button>
          <button class="chip" data-preset="hi3030" type="button">
            <span>30 / 30</span><small>8 × 30s / 30s</small>
          </button>
          <button class="chip" data-preset="metcon" type="button">
            <span>Metcon</span><small>6 × 40s / 20s</small>
          </button>
        </div>
        <div class="fields">
          <label class="field">
            <span>Rounds</span>
            <input id="in-rounds" type="number" inputmode="numeric" min="1" max="30" step="1" value="4">
          </label>
          <label class="field">
            <span>Work (s)</span>
            <input id="in-work" type="number" inputmode="numeric" min="5" max="600" step="5" value="20">
          </label>
          <label class="field">
            <span>Rest (s)</span>
            <input id="in-rest" type="number" inputmode="numeric" min="0" max="600" step="5" value="60">
          </label>
        </div>
        <p id="summary" class="summary"></p>
      </section>

      <section class="card" aria-label="History">
        <div class="card-head">
          <h2>History</h2>
          <button id="btn-clear-history" class="link-btn" hidden type="button">Clear</button>
        </div>
        <ul id="history-list" class="history-list"></ul>
        <p id="history-empty" class="muted">Completed workouts will show up here.</p>
      </section>
    </main>

    <footer class="footer">Works offline &middot; everything stays on your device</footer>
  </div>

  <noscript><p class="noscript">This app needs JavaScript enabled.</p></noscript>
  <script src="js/app.js"></script>
</body>
</html>
